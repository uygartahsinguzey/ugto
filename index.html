<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#5b4636" />
  <meta name="description" content="Tiny Kingdom Idle - küçük köyünü büyük bir krallığa dönüştür." />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="style.css" />
  <title>Tiny Kingdom Idle</title>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">TINY KINGDOM</p>
        <h1 id="kingdomName">Meşe Vadisi</h1>
      </div>
      <div class="header-actions">
        <button id="soundBtn" class="icon-btn" aria-label="Ses aç/kapat">🔊</button>
        <button id="saveBtn" class="icon-btn" aria-label="Kaydet">💾</button>
      </div>
    </header>

    <section class="kingdom-view" aria-label="Krallık görünümü">
      <div class="sky">
        <div class="sun"></div>
        <div class="cloud cloud-a"></div>
        <div class="cloud cloud-b"></div>
      </div>
      <div class="mountains"></div>
      <div class="land">
        <div class="river"></div>
        <div class="village">
          <div class="building house" title="Ev"><span>🏠</span></div>
          <div class="building sawmill locked-visual" data-visual="sawmill" title="Testerehane"><span>🪚</span></div>
          <div class="building mine locked-visual" data-visual="mine" title="Maden"><span>⛏️</span></div>
          <div class="building farm locked-visual" data-visual="farm" title="Çiftlik"><span>🌾</span></div>
          <div class="building castle locked-visual" data-visual="castle" title="Kale"><span>🏰</span></div>
        </div>
      </div>

      <button id="gatherBtn" class="gather-btn">
        <span class="gather-icon">🪓</span>
        <span>Odun Topla</span>
        <small id="tapPowerLabel">+1 odun</small>
      </button>

      <div id="floatingLayer" class="floating-layer" aria-hidden="true"></div>
    </section>

    <section class="resource-strip" aria-label="Kaynaklar">
      <article class="resource-card">
        <span>🪵</span>
        <div><small>Odun</small><strong id="woodValue">0</strong></div>
        <em id="woodRate">+0/sn</em>
      </article>
      <article class="resource-card">
        <span>🪨</span>
        <div><small>Taş</small><strong id="stoneValue">0</strong></div>
        <em id="stoneRate">+0/sn</em>
      </article>
      <article class="resource-card">
        <span>🌾</span>
        <div><small>Yemek</small><strong id="foodValue">0</strong></div>
        <em id="foodRate">+0/sn</em>
      </article>
      <article class="resource-card">
        <span>🪙</span>
        <div><small>Altın</small><strong id="goldValue">0</strong></div>
        <em id="goldRate">+0/sn</em>
      </article>
    </section>

    <nav class="tabs" aria-label="Oyun menüsü">
      <button class="tab active" data-tab="workers">İşçiler</button>
      <button class="tab" data-tab="buildings">Binalar</button>
      <button class="tab" data-tab="upgrades">Yükseltmeler</button>
      <button class="tab" data-tab="kingdom">Krallık</button>
    </nav>

    <main>
      <section id="workersPanel" class="panel active"></section>
      <section id="buildingsPanel" class="panel"></section>
      <section id="upgradesPanel" class="panel"></section>
      <section id="kingdomPanel" class="panel"></section>
    </main>

    <footer>
      <span id="statusText">Krallık büyümeye hazır.</span>
      <span>Sürüm 1.0</span>
    </footer>
  </div>

  <dialog id="offlineDialog">
    <div class="dialog-card">
      <span class="dialog-icon">🌙</span>
      <h2>Tekrar hoş geldin!</h2>
      <p>Sen yokken işçilerin üretmeye devam etti.</p>
      <div id="offlineRewards" class="offline-rewards"></div>
      <button id="collectOfflineBtn" class="primary-btn">Kazancı Topla</button>
    </div>
  </dialog>

  <dialog id="eventDialog">
    <div class="dialog-card">
      <span id="eventIcon" class="dialog-icon">🎉</span>
      <h2 id="eventTitle">Krallık Olayı</h2>
      <p id="eventText"></p>
      <button id="eventAcceptBtn" class="primary-btn">Harika!</button>
    </div>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
